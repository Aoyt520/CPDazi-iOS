name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-14 默认会落到 arm64 配置（'macos-14-arm64-us-default' is not supported）
    # 这里用 macos-13（Intel x86_64），出包通用性也更好
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CPDazi.xcodeproj \
            -scheme CPDazi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/CPDazi.app"
          ls -la build/Build/Products/Release-iphoneos/ || true
          test -d "$APP"
          rm -rf Payload CPDazi.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 移除签名残留，便于第三方工具重签
          rm -rf Payload/CPDazi.app/_CodeSignature
          rm -f Payload/CPDazi.app/embedded.mobileprovision
          zip -qry CPDAzi.ipa Payload
          ls -lh CPDAzi.ipa
          unzip -l CPDAzi.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: CPDAzi-unsigned-ipa
          path: CPDAzi.ipa
          retention-days: 30
